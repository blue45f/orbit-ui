packages:
  - 'apps/*'
  - 'packages/*'
  - 'config/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

# 自社 @heejun/* 공유 config는 이 레포가 채택하려고 의도적으로 갓 퍼블리시한 것이다.
# pnpm 11의 기본 supply-chain 쿨다운(minimumReleaseAge)에서만 예외 처리한다(나머지 정책은 유지).
minimumReleaseAgeExclude:
  - '@heejun/*'

# Workspace catalog: 단일 진실 공급원으로 버전을 통일합니다.
# 패키지에서 "catalog:"로 참조하면 여기 값이 사용됩니다.
catalog:
  # React 19.2
  react: ^19.2.7
  react-dom: ^19.2.7
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.0

  # 타입스크립트 & 노드
  typescript: ^6.0.3
  '@types/node': ^26.0.0

  # 빌드/테스트 툴체인
  vite: ^8.0.16
  vitest: ^4.1.10
  '@vitest/coverage-v8': ^4.1.10
  '@vitest/ui': ^4.1.10
  '@vitejs/plugin-react-swc': ^4.3.1
  jsdom: ^29.1.1

  # 테스팅 라이브러리
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^7.0.0
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  # 접근성 단언 (Vitest 단위 테스트용)
  axe-core: ^4.12.0

overrides:
  handlebars: '>=4.7.9'
  multer: '>=2.2.0'
  undici: '^7.28.0'
  ws: '>=8.21.0'
  form-data: '>=4.0.6'
  hono: '>=4.12.25'
  find-my-way: '>=8.2.2'
  '@fastify/middie': '>=9.3.2'
  fastify: '>=5.7.2'
  fast-uri: '>=3.1.2'
  path-to-regexp: '>=6.3.0'
  serialize-javascript: '>=7.0.3'
  piscina: '>=4.9.3'
  drizzle-orm: '>=0.45.2'
  vitest: '>=4.1.9'
  '@vitest/coverage-v8': '>=4.1.9'
  '@vitest/ui': '>=4.1.9'
  vite: '>=8.0.16'
  jspdf: '>=4.2.1'

auditConfig:
  ignoreGhsas:
    - GHSA-2p57-rm9w-gvfp
