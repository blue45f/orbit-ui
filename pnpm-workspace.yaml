packages:
  - 'apps/*'
  - 'packages/*'
  - 'config/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

# 自社 @heejun/* 공유 config는 이 레포가 채택하려고 의도적으로 갓 퍼블리시한 것이다.
# pnpm 11의 기본 supply-chain 쿨다운(minimumReleaseAge)에서만 예외 처리한다(나머지 정책은 유지).
minimumReleaseAgeExclude:
  - '@heejun/*'

# Workspace catalog: 단일 진실 공급원으로 버전을 통일합니다.
# 패키지에서 "catalog:"로 참조하면 여기 값이 사용됩니다.
catalog:
  # React 19.2
  react: ^19.2.7
  react-dom: ^19.2.7
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.0

  # 타입스크립트 & 노드
  typescript: ^6.0.3
  '@types/node': ^25.9.2

  # 빌드/테스트 툴체인
  vite: ^8.0.16
  vitest: ^4.1.8
  '@vitest/coverage-v8': ^4.1.8
  '@vitest/ui': ^4.1.8
  '@vitejs/plugin-react-swc': ^4.3.1
  jsdom: ^29.1.1

  # 테스팅 라이브러리
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  # 접근성 단언 (Vitest 단위 테스트용)
  axe-core: ^4.12.0
